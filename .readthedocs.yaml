# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# This build only renders the documentation. Tutorial notebooks ship with their outputs already
# committed (see nb_execution_mode in docs/conf.py), so nothing is executed here and the build
# needs no kernel, no VTK, no X server, and no downloads beyond the Python packages themselves.
#
# The package is still installed because autodoc imports it to read docstrings.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        # `docs` only. The `surface` extra (surfplot/brainspace, which pull ~200 MB of VTK) is
        # deliberately absent: those imports are lazy, inside the functions that need them, so
        # autodoc documents the surface-plotting API without them installed. `changepoint`
        # (ruptures) is likewise only needed to run the GAM tutorial, which happens in CI.
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false