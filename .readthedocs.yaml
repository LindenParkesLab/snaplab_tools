# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    # VTK (via brainspace/surfplot) needs OpenGL and an X display even to render offscreen.
    # docs/conf.py starts Xvfb on :99 when it detects the Read the Docs environment.
    - libgl1
    - libglx-mesa0
    - libxrender1
    - libxt6
    - xvfb
  jobs:
    post_install:
      # Schaefer FreeSurfer annotation files, needed by the cortical-surface tutorial.
      # snaplab_tools.plotting reads SCHAEFER_ANNOT_DIR (set in docs/conf.py) to find them; these
      # come from the same CBIG repository that snaplab_tools.utils.load_schaefer_parc uses.
      - mkdir -p $HOME/Schaefer2018_LocalGlobal/Parcellations/FreeSurfer5.3/fsaverage5/label
      - |
        for hemi in lh rh; do
          curl -fsSL -o $HOME/Schaefer2018_LocalGlobal/Parcellations/FreeSurfer5.3/fsaverage5/label/${hemi}.Schaefer2018_400Parcels_7Networks_order.annot \
            "https://github.com/ThomasYeoLab/CBIG/raw/master/stable_projects/brain_parcellation/Schaefer2018_LocalGlobal/Parcellations/FreeSurfer5.3/fsaverage5/label/${hemi}.Schaefer2018_400Parcels_7Networks_order.annot"
        done

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - surface
        - changepoint

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
